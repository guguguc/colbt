name: Colbt
options:
  bundleIdPrefix: com.colbt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../core/include
      - $(SRCROOT)/../core/src
    LIBRARY_SEARCH_PATHS:
      - $(IMCORE_LIB_PATH)
      - $(SRCROOT)/build/lib/sim
    OTHER_LDFLAGS:
      - -limcore
      - -lc++

targets:
  Colbt:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colbt.im
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/Colbt-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  Colbt:
    build:
      targets:
        Colbt: all
    run:
      config: Debug
